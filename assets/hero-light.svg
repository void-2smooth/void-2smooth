<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="VOID">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F6F9"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6F9"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A7ABF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0A7ABF"/>
      <stop offset="70%" stop-color="#5B3FD4"/>
      <stop offset="100%" stop-color="#5B3FD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E141D"/>
      <stop offset="100%" stop-color="#5C6B7A"/>
    </linearGradient>
    <radialGradient id="gc" cx="18%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#0A7ABF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A7ABF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gv" cx="90%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#5B3FD4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5B3FD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.8" fill="#0A7ABF" opacity="0.18"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .pulse { animation: pulse 4.5s ease-in-out infinite; }
      .scan { animation: scan 9s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 0.08; } 88% { opacity: 0.08; } 100% { transform: translateY(320px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .scan { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="20" fill="url(#gc)"/>
  <rect width="1200" height="320" rx="20" fill="url(#gv)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#D5DCE6"/>
  <rect x="80" y="0" width="520" height="2" fill="url(#hair)"/>
  <rect class="scan" x="1" y="0" width="1198" height="2" fill="#0A7ABF"/>

  <text x="72" y="64" fill="#0A7ABF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4.5">JAMES  ·  SOUTH AFRICA</text>

  <text x="70" y="168" fill="#0A7ABF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="22" opacity="0.28" filter="url(#blur)">VOID</text>
  <text x="72" y="166" fill="url(#word)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="22">VOID</text>

  <rect x="72" y="194" width="72" height="2" rx="1" fill="#0A7ABF"/>

  <text x="72" y="232" fill="#5C6B7A" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" letter-spacing="3.2">BUILDER  ·  OPERATOR  ·  EDITOR</text>
  <text x="72" y="268" fill="#0E141D" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15">Websites. Tools. Homelab. Motion. Games.</text>

  <!-- VOID mark -->
  <g transform="translate(1048 160)">
    <circle r="92" fill="none" stroke="#D5DCE6" stroke-width="1"/>
    <circle r="74" fill="none" stroke="#0A7ABF" stroke-width="1.25" stroke-dasharray="6 14" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#0E141D" stroke-width="2" opacity="0.88"/>
    <circle r="48" fill="none" stroke="#0A7ABF" stroke-width="2" stroke-dasharray="151 151" stroke-dashoffset="40" opacity="0.95"/>
    <circle r="22" fill="#F4F6F9" stroke="#5B3FD4" stroke-width="1.5"/>
    <circle class="pulse" r="5" fill="#0A7ABF"/>
  </g>
</svg>
