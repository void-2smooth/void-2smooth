<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="VOID">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="55%" stop-color="#0C1118"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3EC8FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3EC8FF"/>
      <stop offset="70%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#7A5CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2F5F8"/>
      <stop offset="100%" stop-color="#8B98A8"/>
    </linearGradient>
    <radialGradient id="gc" cx="18%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#3EC8FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3EC8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gv" cx="90%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#7A5CFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7A5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.8" fill="#3EC8FF" opacity="0.14"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .pulse { animation: pulse 4.5s ease-in-out infinite; }
      .scan { animation: scan 9s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 0.12; } 88% { opacity: 0.12; } 100% { transform: translateY(320px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .scan { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="20" fill="url(#gc)"/>
  <rect width="1200" height="320" rx="20" fill="url(#gv)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#1B2430"/>
  <rect x="80" y="0" width="520" height="2" fill="url(#hair)"/>
  <rect class="scan" x="1" y="0" width="1198" height="2" fill="#3EC8FF"/>

  <text x="72" y="64" fill="#3EC8FF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4.5">JAMES  ·  SOUTH AFRICA</text>

  <text x="70" y="168" fill="#3EC8FF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="22" opacity="0.28" filter="url(#blur)">VOID</text>
  <text x="72" y="166" fill="url(#word)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="22">VOID</text>

  <rect x="72" y="194" width="72" height="2" rx="1" fill="#3EC8FF"/>

  <text x="72" y="232" fill="#8B98A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" letter-spacing="3.2">BUILDER  ·  OPERATOR  ·  EDITOR</text>
  <text x="72" y="268" fill="#F2F5F8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15">Websites. Tools. Homelab. Motion. Games.</text>

  <!-- VOID mark -->
  <g transform="translate(1048 160)">
    <circle r="92" fill="none" stroke="#1B2430" stroke-width="1"/>
    <circle r="74" fill="none" stroke="#3EC8FF" stroke-width="1.25" stroke-dasharray="6 14" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#F2F5F8" stroke-width="2" opacity="0.88"/>
    <circle r="48" fill="none" stroke="#3EC8FF" stroke-width="2" stroke-dasharray="151 151" stroke-dashoffset="40" opacity="0.95"/>
    <circle r="22" fill="#07090E" stroke="#7A5CFF" stroke-width="1.5"/>
    <circle class="pulse" r="5" fill="#3EC8FF"/>
  </g>
</svg>
